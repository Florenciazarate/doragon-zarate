# CI/CD Doragon
# CI -> en cada push o pull request a main corren los tests
# CD -> si los tests pasan (y es un push a main) se publica en Vercel
name: CI/CD Doragon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar los tests (node --test)
        run: npm test

  deploy:
    name: Despliegue en Vercel
    needs: tests #<- solo corre si los tests pasaron
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar la herramienta de Vercel
        run: npm install --global vercel@latest

      # CD en 3 pasos (forma recomendada por Vercel)
      - name: 1. Traer la configuración del proyecto
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 2. Armar el sitio
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 3. Publicar lo armado en producción
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
